<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piXelForge</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14101c; --panel:#1e1830; --panel2:#2a2142;
  --ember:#ff8a2b; --gold:#ffd24a; --mint:#5df2b0;
  --text:#f1ecff; --muted:#9a8fbf;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'VT323',monospace; font-size:22px;
  display:flex; justify-content:center; align-items:center;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:16px 16px;
}
#app{
  width:min(760px,100%); height:min(94vh,860px);
  display:flex; flex-direction:column; background:var(--panel);
  box-shadow:0 0 0 4px var(--ember),0 0 0 8px var(--bg),0 0 40px rgba(255,138,43,.25);
}
header{
  display:flex; align-items:center; gap:14px; padding:14px 18px;
  background:var(--panel2); border-bottom:4px solid var(--bg);
}
header svg{width:48px;height:48px;image-rendering:pixelated;flex:none}
h1{font-family:'Press Start 2P',monospace;font-size:16px;margin:0;color:var(--text);letter-spacing:1px}
h1 span{color:var(--ember)}
header p{margin:6px 0 0;color:var(--muted);font-size:18px}
.dot{display:inline-block;width:10px;height:10px;background:var(--mint);margin-right:6px;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#clearBtn{
  margin-left:auto; font-family:'Press Start 2P',monospace; font-size:10px;
  background:transparent; color:var(--muted); border:3px solid var(--muted); padding:8px 10px; cursor:pointer;
}
#clearBtn:hover{color:var(--gold);border-color:var(--gold)}

#log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
#log::-webkit-scrollbar{width:10px}
#log::-webkit-scrollbar-thumb{background:var(--ember)}
.msg{
  max-width:82%; padding:10px 14px; line-height:1.15;
  white-space:pre-wrap; word-wrap:break-word; margin:0 6px;
  animation:pop .18s steps(3);
}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.bot{
  align-self:flex-start; background:var(--panel2);
  box-shadow:-4px 0 0 var(--panel2),4px 0 0 var(--panel2),0 -4px 0 var(--panel2),0 4px 0 var(--panel2);
}
.user{
  align-self:flex-end; background:var(--ember); color:#1a1020;
  box-shadow:-4px 0 0 var(--ember),4px 0 0 var(--ember),0 -4px 0 var(--ember),0 4px 0 var(--ember);
}
.sprite{display:block;margin-top:10px;image-rendering:pixelated;width:112px;height:112px;background:var(--bg)}
.typing span{display:inline-block;width:8px;height:8px;background:var(--gold);margin:0 3px;animation:bounce 1s steps(2) infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{50%{transform:translateY(-6px)}}

#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.chip{
  font-family:'VT323',monospace;font-size:19px;background:transparent;color:var(--gold);
  border:3px solid var(--gold);padding:2px 10px;cursor:pointer;
}
.chip:hover{background:var(--gold);color:#1a1020}

#form{display:flex;gap:10px;padding:12px 16px;background:var(--panel2);border-top:4px solid var(--bg)}
#input{
  flex:1;min-width:0;font-family:'VT323',monospace;font-size:22px;color:var(--text);
  background:var(--bg);border:3px solid var(--muted);padding:8px 12px;outline:none;
}
#input:focus{border-color:var(--ember)}
#form button{
  font-family:'Press Start 2P',monospace;font-size:11px;background:var(--ember);color:#1a1020;
  border:none;padding:0 16px;cursor:pointer;box-shadow:0 4px 0 #b25a10;
}
#form button:active{transform:translateY(4px);box-shadow:none}
footer{padding:6px 16px 10px;background:var(--panel2);color:var(--muted);font-size:17px}
code{color:var(--mint)}
@media (max-width:600px){
  #app{height:100dvh;box-shadow:none}
  .msg{max-width:90%}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="11" y="0" width="1" height="1" fill="#ffd24a"/>
      <rect x="13" y="1" width="1" height="1" fill="#ff8a2b"/>
      <rect x="9"  y="1" width="1" height="1" fill="#ff8a2b"/>
      <rect x="2"  y="4" width="12" height="3" fill="#c9c3dd"/>
      <rect x="0"  y="5" width="3" height="2" fill="#c9c3dd"/>
      <rect x="5"  y="7" width="6" height="3" fill="#8e86a8"/>
      <rect x="3"  y="10" width="10" height="3" fill="#6d6590"/>
      <rect x="2"  y="4" width="12" height="1" fill="#efeaff"/>
    </svg>
    <div>
      <h1>pi<span>X</span>elForge</h1>
      <p><i class="dot"></i>online (offline brain)</p>
    </div>
    <button id="clearBtn" title="Clear chat">CLR</button>
  </header>

  <main id="log" aria-live="polite"></main>
  <div id="chips"></div>

  <form id="form" autocomplete="off">
    <input id="input" placeholder="Say something to the forge..." maxlength="300">
    <button type="submit">SEND</button>
  </form>
  <footer>train me: <code>teach: your question =&gt; my answer</code></footer>
</div>

<script>
(() => {
  const BOT = "piXelForge";
  const $ = s => document.querySelector(s);
  const log = $('#log'), form = $('#form'), input = $('#input'), chips = $('#chips');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------- tiny storage helper (safe if localStorage is blocked) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('pxf_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('pxf_' + k, JSON.stringify(v)); } catch {} }
  };

  const state = {
    name: store.get('name', null),
    taught: store.get('taught', []),     // [{words:[...], answer:"..."}]
    history: store.get('history', []),   // [{who, text}]
    lastIntent: null
  };

  // ---------- text helpers ----------
  const tokenize = s => s.toLowerCase().replace(/[^a-z0-9\s']/g, ' ').split(/\s+/).filter(Boolean);
  const fill = s => s.replace(/\{name\}/g, state.name || 'friend');

  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }
  // typo tolerance: longer keywords may be off by 1-2 letters
  const sortLetters = s => s.split('').sort().join('');
  const near = (w, k) => w === k || (k.length > 3 && (
    lev(w, k) <= (k.length > 6 ? 2 : 1) ||
    (w.length === k.length && sortLetters(w) === sortLetters(k) && lev(w, k) <= 2)   // swapped letters: tiem -> time
  ));

  // ---------- content ----------
  const JOKES = [
    "Why do programmers prefer dark mode? Because light attracts bugs.",
    "There are 10 types of people: those who understand binary and those who don't.",
    "Why did the pixel go to school? To get a little more resolution.",
    "A SQL query walks into a bar, sees two tables and asks: can I join you?",
    "Why was the JavaScript developer sad? He didn't Node how to Express himself.",
    "I'd tell you a UDP joke, but you might not get it."
  ];
  const FACTS = [
    "Many classic arcade characters, Pac-Man included, were drawn on tiny 16x16 pixel grids.",
    "A byte has 8 bits, which is one reason sprites are so often 8x8.",
    "Honey never really spoils. Edible honey has been found in ancient Egyptian tombs.",
    "Octopuses have three hearts and blue blood.",
    "The first computer 'bug' was a real moth found in a Harvard Mark II in 1947.",
    "Sunlight takes about 8 minutes to reach Earth."
  ];
  const STUDY = [
    "Try 25/5: study 25 minutes, rest 5, repeat 4 times, then take a longer break.",
    "Explain the topic out loud like you're teaching a friend. Wherever you get stuck is what to revise.",
    "Solve past questions. Active recall beats re-reading every time.",
    "Sleep before exams. A rested brain keeps what a tired one drops."
  ];
  const MOTIVATE = [
    "Small steps still move you forward. Do 10 minutes of the thing you're avoiding.",
    "Every expert was once a beginner who didn't quit. Keep forging, {name}.",
    "Progress beats perfect. Ship it, then improve it."
  ];
  const CODE = [
    "Start tiny: make it work, then make it clean, then make it fast.",
    "Read error messages from the bottom line up. The real clue is usually there.",
    "Build projects, not just tutorials. A chatbot like me is a perfect first one.",
    "console.log() and print() are legit debugging tools. Use them without shame."
  ];

  // ---------- pixel sprite generator (draws on a canvas) ----------
  function makeSprite() {
    const N = 8, S = 14;
    const c = document.createElement('canvas');
    c.width = c.height = N * S; c.className = 'sprite';
    const g = c.getContext('2d');
    const pal = ['#ff8a2b', '#ffd24a', '#5df2b0', '#7aa2ff', '#ff6fae', '#c792ff'];
    const col = pick(pal);
    const half = N / 2, grid = [];
    for (let y = 0; y < N; y++) {
      grid[y] = [];
      for (let x = 0; x < half; x++) grid[y][x] = Math.random() < 0.55;
    }
    for (let y = 3; y < 6; y++) grid[y][3] = true;   // keep a solid core
    grid[2][2] = true;                               // room for eyes
    g.fillStyle = col;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const sx = x < half ? x : N - 1 - x;
      if (grid[y][sx]) g.fillRect(x * S, y * S, S, S);
    }
    g.fillStyle = '#14101c';
    g.fillRect(2 * S, 2 * S, S, S);
    g.fillRect(5 * S, 2 * S, S, S);
    return c;
  }

  // ---------- safe calculator ----------
  function tryMath(text) {
    let e = text.replace(/^(calc|calculate|solve|what is|what's|whats|compute)\s*/i, '')
                .replace(/\?+$/, '')
                .replace(/(\d)\s*x\s*(\d)/gi, '$1*$2');
    if (!/^[\d+\-*/().%^\s]+$/.test(e) || !/\d/.test(e) || !/[+\-*/%^]/.test(e)) return null;
    try {
      const v = Function('"use strict";return (' + e.replace(/\^/g, '**') + ')')();
      if (typeof v !== 'number' || !isFinite(v)) return "That one breaks maths itself. Try something else.";
      return `${e.trim()} = ${Math.round(v * 1e10) / 1e10}`;
    } catch { return "My calculator choked on that. Check your brackets and symbols."; }
  }

  // ---------- intents (the "brain") ----------
  // keys: single words are typo-tolerant; keys with spaces must appear as a phrase
  const INTENTS = [
    { id: 'how', keys: ['how are you', 'how r u', 'whats up', "what's up", 'how do you do', 'how you doing'],
      r: ["Running hot and fully forged! How about you, {name}?", "All pixels present and glowing. What are we building today?"] },
    { id: 'who', keys: ['who are you', 'your name', 'what are you', 'who made you', 'who created you', 'who built you', 'introduce yourself'],
      r: ["I'm piXelForge, a custom chatbot forged from pure JavaScript. I run right in your browser, no servers involved."] },
    { id: 'help', keys: ['help', 'commands', 'what can you do', 'menu'],
      r: ["Here's what I can do:\n• chat, jokes, fun facts\n• study, coding and motivation tips\n• maths: try  calc 12*(3+4)\n• /pixel draws a random sprite\n• tell me: my name is ...\n• teach me: teach: question => answer\n• /time  /clear  /forget"] },
    { id: 'joke', keys: ['joke', 'funny', 'laugh', 'make me laugh'], r: JOKES },
    { id: 'fact', keys: ['fact', 'fun fact', 'tell me something', 'did you know'], r: FACTS },
    { id: 'study', keys: ['study', 'exam', 'exams', 'homework', 'revise', 'revision', 'marks'], r: STUDY },
    { id: 'motivate', keys: ['motivate', 'motivation', 'inspire', 'lazy', 'procrastinate', 'give up'], r: MOTIVATE },
    { id: 'code', keys: ['code', 'coding', 'python', 'javascript', 'programming', 'html', 'java', 'debug'], r: CODE },
    { id: 'pixel', keys: ['pixel', 'sprite', 'pixel art', 'draw'],
      a: () => ({ text: "Fresh off the anvil. One random sprite coming up:", art: makeSprite }) },
    { id: 'time', keys: ['time', 'what time', 'clock'],
      a: () => `It's ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} on your clock.` },
    { id: 'date', keys: ['date', 'today', 'what day', 'which day'],
      a: () => `Today is ${new Date().toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.` },
    { id: 'myname', keys: ['my name', 'who am i'],
      a: () => state.name ? `You're ${state.name}, forge master.` : "I don't know yet. Tell me with: my name is ..." },
    { id: 'thanks', keys: ['thanks', 'thank', 'thx', 'tysm'],
      r: ["Anytime, {name}!", "Happy to help. Hammer on!"] },
    { id: 'bye', keys: ['bye', 'goodbye', 'cya', 'see you', 'good night', 'gn'],
      r: ["See you, {name}! The forge stays warm.", "Bye! Come back with new ideas."] },
    { id: 'greet', keys: ['hi', 'hello', 'hey', 'hii', 'hiya', 'yo', 'namaste', 'sup', 'good morning', 'good evening'],
      r: ["Hey {name}! Welcome to the forge. Type 'help' to see what I can do.", "Hello {name}! What shall we craft today?"] }
  ];

  const FALLBACK = [
    "Hmm, that one slipped past my anvil. Try 'help', or teach me with: teach: question => answer",
    "I don't know that yet. Teach me: teach: your question => my answer",
    "Not in my forge yet. Ask me for a joke, a fact, a sprite or some maths!"
  ];

  function scoreIntent(it, words, joined) {
    let s = 0;
    for (const k of it.keys) {
      if (k.includes(' ')) { if (joined.includes(k)) s += k.split(' ').length * 2; }
      else if (words.some(w => near(w, k))) s += 1;
    }
    return s;
  }

  function runIntent(it) {
    state.lastIntent = it;
    if (it.a) { const out = it.a(); return typeof out === 'string' ? { text: out } : out; }
    return { text: fill(pick(it.r)) };
  }

  function findTaught(words) {
    const set = new Set(words);
    let best = null, bs = 0;
    for (const t of state.taught) {
      const tw = new Set(t.words);
      if (!tw.size) continue;
      let inter = 0; tw.forEach(w => set.has(w) && inter++);
      const coverage = inter / tw.size;            // how much of the taught question is in the message
      const precision = inter / set.size;          // how much of the message is the taught question
      const score = coverage * precision;
      if (coverage >= 0.8 && precision >= 0.3 && score > bs) { bs = score; best = t; }
    }
    return best;
  }

  function think(raw) {
    const text = raw.trim();
    const words = tokenize(text);
    const joined = ' ' + words.join(' ') + ' ';

    // slash commands
    if (text === '/help') return runIntent(INTENTS.find(i => i.id === 'help'));
    if (text === '/joke') return runIntent(INTENTS.find(i => i.id === 'joke'));
    if (text === '/time') return runIntent(INTENTS.find(i => i.id === 'time'));
    if (text === '/pixel') return runIntent(INTENTS.find(i => i.id === 'pixel'));
    if (text === '/forget') {
      state.taught = []; state.name = null;
      store.set('taught', []); store.set('name', null);
      return { text: "Memory wiped. Fresh anvil, fresh start." };
    }

    // teach mode
    const t = text.match(/^teach\s*:\s*(.+?)\s*=>\s*(.+)$/i);
    if (t) {
      const q = tokenize(t[1]);
      if (!q.length) return { text: "I need a question before the arrow: teach: question => answer" };
      state.taught.push({ words: q, answer: t[2].trim() });
      store.set('taught', state.taught);
      return { text: `Learned! Ask me "${t[1].trim()}" any time.` };
    }

    // remember name
    const n = text.match(/^(?:my name is|call me)\s+([a-z][a-z' -]{0,19})$/i);
    if (n) {
      state.name = n[1].trim().replace(/\b\w/g, c => c.toUpperCase());
      store.set('name', state.name);
      return { text: `Nice to meet you, ${state.name}! I'll remember that.` };
    }

    // maths
    const m = tryMath(text);
    if (m) return { text: m };

    // "another one" -> repeat last intent
    if (/^(another|more|again|next)( one)?[!. ]*$/i.test(text) && state.lastIntent) return runIntent(state.lastIntent);

    // things you taught me come first
    const learned = findTaught(words);
    if (learned) return { text: learned.answer };

    // score intents
    let best = null, bs = 0;
    for (const it of INTENTS) {
      const s = scoreIntent(it, words, joined);
      if (s > bs) { bs = s; best = it; }
    }
    if (best) return runIntent(best);

    state.lastIntent = null;
    return { text: pick(FALLBACK) };
  }

  // ---------- rendering ----------
  const scroll = () => { log.scrollTop = log.scrollHeight; };

  function addMsg(who, text, { instant = false, art = null } = {}) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    log.appendChild(el);
    if (who === 'user' || instant) {
      el.textContent = text;
      if (art) el.appendChild(art);
      scroll();
      return Promise.resolve();
    }
    return new Promise(res => {
      let i = 0;
      const step = () => {
        i += 2;
        el.textContent = text.slice(0, i);
        scroll();
        if (i < text.length) setTimeout(step, 14);
        else { if (art) el.appendChild(art); scroll(); res(); }
      };
      step();
    });
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(el); scroll();
    return el;
  }

  function save(who, text) {
    state.history.push({ who, text });
    state.history = state.history.slice(-60);
    store.set('history', state.history);
  }

  let busy = false;
  async function send(raw) {
    const text = raw.trim();
    if (!text || busy) return;
    busy = true; input.value = '';

    if (text === '/clear') { clearChat(); busy = false; return; }

    addMsg('user', text, { instant: true });
    save('user', text);
    const typing = showTyping();
    const reply = think(text);
    await sleep(350 + Math.min(700, reply.text.length * 8));
    typing.remove();
    await addMsg('bot', reply.text, { art: reply.art ? reply.art() : null });
    save('bot', reply.text);
    busy = false; input.focus();
  }

  async function greet() {
    const text = state.name
      ? `Welcome back, ${state.name}! The forge is hot. Type 'help' to see what I can do.`
      : `I'm ${BOT}. Tell me your name with "my name is ..." or just say hi!`;
    await addMsg('bot', text);
    save('bot', text);
  }

  function clearChat() {
    log.innerHTML = '';
    state.history = []; store.set('history', []);
    greet();
  }

  // ---------- boot ----------
  ['Tell me a joke', 'Fun fact', 'Study tips', '/pixel', 'Help'].forEach(label => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label;
    b.onclick = () => send(label);
    chips.appendChild(b);
  });

  form.addEventListener('submit', e => { e.preventDefault(); send(input.value); });
  $('#clearBtn').onclick = () => { if (!busy) clearChat(); };

  if (state.history.length) {
    state.history.forEach(m => addMsg(m.who, m.text, { instant: true }));
  } else {
    greet();
  }
  input.focus();
})();
</script>
</body>
</html>
